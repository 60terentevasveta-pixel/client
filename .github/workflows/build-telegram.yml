name: Build Telegram iOS (unsigned IPA)

# Собирает официальный клиент Telegram-iOS (открытый код) со ВАШИМ api_id/api_hash.
# Результат: IPA, который потом подписывается в Sideloadly. Запуск вручную: Actions -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Образ macOS (для Xcode 27: xcode-27)'
        default: 'xcode-27'
        required: true
      ref:
        description: 'Ветка или тег Telegram-iOS (пусто = master)'
        default: ''
        required: false

jobs:
  build:
    runs-on: ${{ github.event.inputs.runner }}
    timeout-minutes: 350
    env:
      TG_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TG_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
    steps:
      - name: Проверка секретов
        run: |
          if ! [[ "$TG_API_ID" =~ ^[0-9]+$ ]]; then echo "::error::Секрет TELEGRAM_API_ID пуст или не число"; exit 1; fi
          if ! [[ "$TG_API_HASH" =~ ^[0-9a-f]{32}$ ]]; then echo "::error::Секрет TELEGRAM_API_HASH должен быть 32 символа 0-9a-f"; exit 1; fi

      - name: Свободное место и железо
        run: |
          df -h /
          sysctl -n hw.ncpu hw.memsize
          sw_vers
          ls /Applications | grep -i xcode || true

      - name: Скачать Telegram-iOS
        run: |
          REF="${{ github.event.inputs.ref }}"
          if [ -n "$REF" ]; then
            git clone --depth 1 --branch "$REF" --recurse-submodules --shallow-submodules -j8 https://github.com/TelegramMessenger/Telegram-iOS.git telegram
          else
            git clone --depth 1 --recurse-submodules --shallow-submodules -j8 https://github.com/TelegramMessenger/Telegram-iOS.git telegram
          fi
          cd telegram
          git log -1 --oneline
          cat versions.json

      - name: Выбрать Xcode по versions.json
        working-directory: telegram
        run: |
          XV=$(python3 -c "import json;print(json.load(open('versions.json'))['xcode'])")
          echo "Нужен Xcode $XV"
          CAND=$(ls -d /Applications/Xcode_${XV}*.app 2>/dev/null | head -1 || true)
          if [ -z "$CAND" ]; then
            MAJ=${XV%%.*}
            CAND=$(ls -d /Applications/Xcode_${MAJ}*.app 2>/dev/null | sort -V | tail -1 || true)
          fi
          if [ -n "$CAND" ]; then
            sudo xcode-select -s "$CAND/Contents/Developer"
            echo "OVERRIDE=" >> $GITHUB_ENV
          else
            echo "::warning::Xcode $XV нет на образе, использую текущий с --overrideXcodeVersion"
            echo "OVERRIDE=--overrideXcodeVersion" >> $GITHUB_ENV
          fi
          xcodebuild -version

      - name: Подставить ваш api_id / api_hash
        working-directory: telegram
        run: |
          python3 - <<'PY'
          import json, os
          p = 'build-system/appstore-configuration.json'
          c = json.load(open(p))
          print('ключи конфигурации:', sorted(c.keys()))
          for k in ('api_id', 'api_hash'):
              assert k in c, f'в конфигурации нет ключа {k}'
          c['api_id'] = os.environ['TG_API_ID']
          c['api_hash'] = os.environ['TG_API_HASH']
          json.dump(c, open('build-system/glassgram-configuration.json', 'w'), indent=2)
          PY

      - name: Продлить срок фейковых профилей (в репозитории они просрочены)
        working-directory: telegram
        run: |
          set -eo pipefail
          python3 - <<'PY'
          import glob, re, subprocess, os, tempfile
          tmp = tempfile.mkdtemp()
          k, c, pl = tmp + '/k.pem', tmp + '/c.pem', tmp + '/p.plist'
          subprocess.run(['openssl', 'req', '-x509', '-newkey', 'rsa:2048', '-nodes', '-keyout', k, '-out', c,
                          '-subj', '/CN=GlassGram Fake', '-days', '3650'], check=True, capture_output=True)
          def bump(m):
              return m.group(1) + str(int(m.group(2)) + 10).encode() + m.group(3)
          for f in sorted(glob.glob('build-system/fake-codesigning/profiles/*.mobileprovision')):
              plist = subprocess.run(['openssl', 'smime', '-inform', 'der', '-verify', '-noverify', '-in', f],
                                     check=True, capture_output=True).stdout
              new, n = re.subn(rb'(<key>ExpirationDate</key>\s*<date>)(\d{4})(-[^<]+</date>)', bump, plist)
              assert n == 1, f + ': ExpirationDate не найден'
              open(pl, 'wb').write(new)
              subprocess.run(['openssl', 'smime', '-sign', '-signer', c, '-inkey', k, '-in', pl, '-out', f,
                              '-outform', 'der', '-nodetach', '-binary'], check=True, capture_output=True)
              chk = subprocess.run(['openssl', 'smime', '-inform', 'der', '-verify', '-noverify', '-in', f], capture_output=True)
              assert chk.returncode == 0, f + ': проверка подписи не прошла'
              print(os.path.basename(f), 'продлён до +10 лет')
          PY

      - name: Патч - работать без App Group (бесплатный Apple ID их не даёт)
        working-directory: telegram
        run: |
          set -eo pipefail
          python3 - <<'PY'
          p = 'submodules/TelegramUI/Sources/AppDelegate.swift'
          s = open(p, encoding='utf-8').read()
          old = 'let maybeAppGroupUrl = FileManager.default.containerURL(forSecurityApplicationGroupIdentifier: appGroupName)'
          new = ('let maybeAppGroupUrl: URL? = FileManager.default.containerURL(forSecurityApplicationGroupIdentifier: appGroupName)'
                 ' ?? FileManager.default.urls(for: .documentDirectory, in: .userDomainMask).first')
          assert s.count(old) == 1, 'строка с App Group не найдена - код Telegram изменился'
          open(p, 'w', encoding='utf-8').write(s.replace(old, new))
          print('патч применён')
          PY
          echo "--- остальные обращения к App Group в основном коде:"
          grep -rn "forSecurityApplicationGroupIdentifier" submodules Telegram --include=*.swift --include=*.m --include=*.mm | grep -v "Telegram/Share\|Telegram/Notification\|Telegram/SiriIntents\|Telegram/Widget\|Telegram/Broadcast" || true

      - name: Патч - отключить iCloud-хранилище токенов (из-за него крашится без iCloud)
        working-directory: telegram
        run: |
          set -eo pipefail
          python3 - <<'PY'
          import re
          p = 'submodules/TelegramCore/Sources/Authorization.swift'
          s = open(p, encoding='utf-8').read()
          s, n1 = re.subn(r'NSUbiquitousKeyValueStore\.default\.object\(forKey: "T_SLTokens"\) as\? \[String\]', '(nil as [String]?)', s)
          lines, n2, out = s.split('\n'), 0, []
          for ln in lines:
              if ln.strip().startswith('NSUbiquitousKeyValueStore.default.'):
                  out.append('        // ' + ln.strip() + '  // отключено патчем')
                  n2 += 1
              else:
                  out.append(ln)
          s = '\n'.join(out)
          assert n1 >= 1 and n2 >= 1, 'не нашли обращения к iCloud: %d %d' % (n1, n2)
          assert 'NSUbiquitousKeyValueStore' not in re.sub(r'//.*', '', s), 'остались обращения к iCloud'
          open(p, 'w', encoding='utf-8').write(s)
          print('заменено чтений:', n1, 'отключено записей:', n2)
          PY
          echo "--- остальные обращения к iCloud KVS:"
          grep -rn "NSUbiquitousKeyValueStore" submodules Telegram --include=*.swift --include=*.m --include=*.mm | grep -v "//" || true

      - name: Патч - отключить обращение к CloudKit (аварийные адреса через iCloud)
        working-directory: telegram
        run: |
          set -eo pipefail
          python3 - <<'PY'
          p = 'submodules/TelegramUI/Sources/AppDelegate.swift'
          s = open(p, encoding='utf-8').read()
          old = 'isICloudEnabled: buildConfig.isICloudEnabled'
          assert s.count(old) == 1, 'не найдено isICloudEnabled в AppDelegate - код Telegram изменился'
          open(p, 'w', encoding='utf-8').write(s.replace(old, 'isICloudEnabled: false'))
          print('CloudKit отключён')
          PY
          echo "--- остальные CKContainer / CloudKit в коде:"
          grep -rIn "CKContainer\|CKDatabase" submodules Telegram --include=*.swift --include=*.m --include=*.mm | grep -v "submodules/CloudData" || true

      - name: Патч - отключить Siri и iCloud-флаги (без платного аккаунта их нет)
        working-directory: telegram
        run: |
          set -eo pipefail
          python3 - <<'PY'
          p = 'submodules/BuildConfig/Sources/BuildConfig.m'
          s = open(p, encoding='utf-8').read()
          for old, new in (('return APP_CONFIG_IS_SIRI_ENABLED;', 'return false;'),
                           ('return APP_CONFIG_IS_ICLOUD_ENABLED;', 'return false;')):
              assert s.count(old) == 1, 'не найдено: ' + old
              s = s.replace(old, new)
          open(p, 'w', encoding='utf-8').write(s)
          print('Siri и iCloud выключены')
          PY

